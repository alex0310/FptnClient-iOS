name: FptnClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  FptnPackage:
    path: .

targets:
  FptnClient:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - FptnClient.entitlements
    dependencies:
      - package: FptnPackage
        product: FptnCore
      - package: FptnPackage
        product: FptnShared
      - target: FptnTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fptnclient
        PRODUCT_NAME: FptnClient
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FptnClient.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  FptnTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - Info.plist
          - FptnTunnel.entitlements
    dependencies:
      - package: FptnPackage
        product: FptnCore
      - package: FptnPackage
        product: FptnShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fptnclient.tunnel
        PRODUCT_NAME: FptnTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/FptnTunnel.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  FptnClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FptnClientTests
    dependencies:
      - target: FptnClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fptnclient.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  FptnClient:
    build:
      targets:
        FptnClient: all
    test:
      config: Debug
      targets:
        - FptnClientTests
    run:
      config: Debug
    archive:
      config: Release
